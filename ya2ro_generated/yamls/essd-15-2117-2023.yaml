type: paper
title: 'Moho depths beneath the European Alps: a homogeneously processed map and receiver functions database'
summary: 'We use seismic waveform data from the AlpArray Seismic Network and three other temporary seismic networks, to perform
  receiver function (RF) calculations and time-to-depth migration to update the knowledge of the Moho discontinuity beneath
  the broader European Alps. In particular, we set up a homogeneous processing scheme to compute RFs using the time-domain
  iterative deconvolution method and apply consistent quality control to yield 112 205 high-quality RFs. We then perform time-to-depth
  migration in a newly implemented 3D spherical coordinate system using a European-scale reference P and S wave velocity model.
  This approach, together with the dense data coverage, provide us with a 3D migrated volume, from which we present Published
  by Copernicus Publications. 2118 K. Michailos et al.: Moho depths beneath the European Alps migrated profiles that reflect
  the first-order crustal thickness structure. We create a detailed Moho map by manually picking the discontinuity in a set
  of orthogonal profiles covering the entire area. We make the RF dataset, the software for the entire processing workflow,
  as well as the Moho map, openly available; these open-access datasets and results will allow other researchers to build
  on the current study.'
