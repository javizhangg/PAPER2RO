type: paper
title: three-dimensional, multimodal synchrotron data for machine learning applications
summary: Machine learning techniques are being increasingly applied in medical and physical sciences across a variety of imaging
  modalities; however, an important issue when developing these tools is the availability of good quality training data. Here
  we present a unique, multimodal synchrotron dataset of a bespoke zinc-doped Zeolite 13X sample that can be used to develop
  advanced deep learning and data fusion pipelines. Multi-resolution micro X-ray computed tomography was performed on a zincdoped
  Zeolite 13X fragment to characterise its pores and features before spatially resolved X-ray diffraction computed tomography
  was carried out to characterise the topographical distribution of sodium and zinc phases. Zinc absorption was controlled
  to create a simple, spatially isolated, twophase material. Both raw and processed data are available as a series of Zenodo
  entries. altogether we present a spatially resolved, three-dimensional, multimodal, multi-resolution dataset that can be
  used to develop machine learning techniques. Such techniques include the development of super-resolution, multimodal data
  fusion, and 3D reconstruction algorithms.
