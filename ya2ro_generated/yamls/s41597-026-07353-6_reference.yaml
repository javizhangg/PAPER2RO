type: paper
title: 'A national-scale database of groundwater level data for Switzerland ARTICLE IN PRESS CONFIDENTIAL COPY OF SUBMISSION
  FOR PEER REVIEW ONLY Tracking no: SDATA-25-04112B A national-scale database of groundwater level data for Switzerland'
summary: Groundwater is a vital component of the global supply of freshwater, playing a critical role for human populations,
  agriculture, and ecosystems. Due to the complex interactions between groundwater, surface water, climate, and human activity,
  these systems are frequently studied using advanced data analysis and modeling techniques. The effectiveness of these methods
  is generally enhanced by the availability and quality of data. In Switzerland, the focus area of this study, groundwater
  data is fragmented and lacks a standardized nationwide compilation. Consequently, the process of conducting nationwide studies
  with substantial sample sizes is both resourceintensive and time-consuming. In this paper we introduce the Swiss Groundwater
  Database, a comprehensive compilation of groundwater time series and associated metadata throughout Switzerland. The current
  database consists of groundwater level data from 985 monitoring wells, which were completed with additional static and time-varying
  variables. The environmental characteristics and climate indices were compiled and determined for each monitoring well.
  The database is designed to facilitate and support large-sample hydrological research related to groundwater in Switzerland
  and beyond.
