type: paper
title: This artifact appendix is included in the Artifact Appendices to the Proceedings of the 33rd USENIX Security Symposium
  and appends to the paper of the same name that appears in the Proceedings of the 33rd USENIX Security Symposium
summary: In our paper, we provide a systematization of knowledge that covers 133 research papers that account for 17 years
  of research on the security of PLCs. This SoK produced two artifacts. A systematic literature review dataset and a threat
  taxonomy called ICS 2 Matrix.
